name: weight_nest
description: 鹦鹉体重记录系统 - 离线单机版 MVP
version: 1.9.9+57
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  # 数据库
  drift: ^2.22.0
  drift_flutter: ^0.2.1
  # Excel 导出
  excel: ^4.0.6
  fl_chart: ^0.71.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.6.1
  # 工具
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.0
  share_plus: ^10.0.0
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2
  sqlite3_flutter_libs: ^0.5.26

dev_dependencies:
  build_runner: ^2.4.13
  # 代码生成
  drift_dev: ^2.22.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - pubspec.yaml
